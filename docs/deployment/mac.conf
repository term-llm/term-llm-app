# CODE ONLY — install after review under /etc/nginx/term-llm-locations.d/mac.conf.
# Included by term-llm.com's HTTPS vhost, NOT the Hugo deployment webroot.
location = /mac/appcast.xml {
    alias /var/www/term-llm-downloads/mac/appcast.xml;
    disable_symlinks on;
    types { }
    default_type application/xml;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Serve the convenience download directly: HTTPS byte verification rejects redirects.
location = /mac/download {
    alias /var/www/term-llm-downloads/mac/term-llm-macos-latest.zip;
    disable_symlinks on;
    types { }
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="term-llm-macos.zip"' always;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ "^/mac/(term-llm-macos-[0-9]+(?:\.[0-9]+)*-[0-9]+-[a-f0-9]{64}\.zip)$" {
    alias /var/www/term-llm-downloads/mac/$1;
    disable_symlinks on;
    types { }
    default_type application/zip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

# No indexes, staging files, dotfiles, fixed ZIP filename or arbitrary content is served.
location /mac/ { return 404; }
