name: Phone-owned Hub HTTP slices

on:
  pull_request:
    paths:
      - 'Shared/**'
      - 'TermLLM/**'
      - 'TermLLMTests/**'
      - 'TermLLMUITests/PhoneHubUITests.swift'
      - 'TermLLM.xcodeproj/**'
      - 'scripts/native-hub/**'
      - 'scripts/phone-hub/**'
      - '.github/workflows/phone-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test original and reused multi-source fixture/provenance gates
        run: |
          python3 -m unittest discover -s scripts/native-hub -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/phone-hub -p 'test_*.py' -v
          bash -n scripts/native-hub/capture.sh
          bash -n scripts/phone-hub/capture.sh
      - name: Select an installed simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_select_ios_simulator.py
          printf 'SIMULATOR_UDID=%s\n' "$(python3 scripts/select-ios-simulator.py)" >> "$GITHUB_ENV"
      - name: Compile app and test both HTTP-only slices in the actual simulator
        run: bash scripts/phone-hub/capture.sh
      - name: Preserve private labelled protocol-fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-hub-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone-hub-artifacts/
          retention-days: 7
          if-no-files-found: warn
