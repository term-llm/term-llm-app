name: Linked devices native validation

# Opt-in only. Dispatch from main after merging trusted changes.
# Never use a GitHub-hosted/paid fallback for this native build.
# The job is native-simulator-tests.yml; the suites are listed in
# TestPlans/TermLLM-LinkedDevices.xctestplan.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linked-devices-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/native-simulator-tests.yml
    with:
      test-plan: TermLLM-LinkedDevices
