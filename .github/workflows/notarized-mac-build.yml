name: Notarized Mac build

# Every app change pushed to main becomes a Developer ID signed, notarized and
# stapled term-llm.app on this repository's Releases page. Self-hosted only: no
# hosted fallback, Actions cache or artifact storage. Release uploads go to
# the production Sparkle feed and GitHub Releases.
# Prerequisites: docs/SELF-HOSTED-CI.md#sparkle-updates and "Notarized Mac builds".
on:
  push:
    branches: [main]
    paths:
      - 'Shared/**'
      - 'TermLLM/**'
      - 'TermLLMMac/**'
      - 'TermLLMMacKit/**'
      - 'TermLLMComputerUse/**'
      - 'TermLLMComputerCLI/**'
      - 'ComputerUseKit/**'
      - 'TermLLMNotificationService/**'
      - 'TermLLM.xcodeproj/**'
      - 'scripts/ci/**'
      - '.github/workflows/notarized-mac-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notarized-mac-build
  cancel-in-progress: false

jobs:
  release:
    # Signing secrets only reach trusted main builds; never pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, term-llm-local]
    # Notarization alone may wait up to 45 minutes.
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # 1Password secret references, not secrets: the signing items live in the
      # "term-llm CI" vault, which the OP_SERVICE_ACCOUNT_TOKEN service account can read.
      SPARKLE_PUBLIC_KEY_REF: 'op://term-llm CI/Mac Sparkle/public key'
      SPARKLE_PRIVATE_KEY_REF: 'op://term-llm CI/Mac Sparkle/private key'
      DOWNLOADS_SSH_PRIVATE_KEY_REF: 'op://term-llm CI/Mac downloads SSH/private key'
      DOWNLOADS_SSH_KNOWN_HOSTS_REF: 'op://term-llm CI/Mac downloads SSH/known hosts'
      MACOS_SIGN_P12_REF: 'op://term-llm CI/Developer ID Application/developer-id.p12'
      MACOS_SIGN_PASSWORD_REF: 'op://term-llm CI/Developer ID Application/password'
      MACOS_NOTARY_KEY_REF: 'op://term-llm CI/App Store Connect notary key/AuthKey_94WH5NUQB4.p8'
      MACOS_NOTARY_KEY_ID_REF: 'op://term-llm CI/App Store Connect notary key/key id'
      MACOS_NOTARY_ISSUER_ID_REF: 'op://term-llm CI/App Store Connect notary key/issuer id'
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use installed MacBook tools and selected Xcode
        run: |
          source scripts/ci/bootstrap-macos.sh
          printf 'DEVELOPER_DIR=%s\n' "$(xcode-select -p)" >> "$GITHUB_ENV"
          printf 'MAC_RELEASE_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/term-llm-mac-release.XXXXXX")" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Select the next Mac patch version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            select-version --repository "$GITHUB_REPOSITORY"
      - name: Fetch SHA-256 pinned Sparkle 2.10.1 signing tools
        run: python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" fetch-sparkle-tools
      # The only GitHub secret is the 1Password service account token. This
      # step only receives whether it is set.
      - name: Require the 1Password service account token and CLI
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        shell: bash
        run: |
          if [[ "$OP_SERVICE_ACCOUNT_TOKEN" != true ]]; then
            echo "::error::Missing repository secret OP_SERVICE_ACCOUNT_TOKEN (docs/SELF-HOSTED-CI.md, Notarized Mac builds)"
            exit 1
          fi
          command -v op >/dev/null || { echo "::error::Install the 1Password CLI (op) on the runner Mac"; exit 1; }
          op --version
      # The token only ever enters a step through env, never a run script: the
      # runner writes run scripts to disk. `op read` returns secrets into memory;
      # the only ones stored land on the job RAM disk.
      - name: Install Developer ID profiles and import the identity into a RAM-disk keychain
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            prepare --build-number "$GITHUB_RUN_NUMBER"
      - name: Archive and export with Developer ID signing
        shell: bash
        run: |
          set -euo pipefail
          # Release builds must not inherit a local-feed test -D condition,
          # whether supplied as active conditions or OTHER_SWIFT_FLAGS.
          xcodebuild archive -quiet \
            -project TermLLM.xcodeproj \
            -scheme TermLLMMac \
            -configuration Release \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS= \
            OTHER_SWIFT_FLAGS= \
            -destination 'generic/platform=macOS' \
            -archivePath "$MAC_RELEASE_DIR/term-llm.xcarchive" \
            -derivedDataPath "$MAC_RELEASE_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$MAC_RELEASE_DIR/SourcePackages" \
            -disableAutomaticPackageResolution \
            -xcconfig "$MAC_RELEASE_DIR/DeveloperID.xcconfig"
          xcodebuild -exportArchive -quiet \
            -archivePath "$MAC_RELEASE_DIR/term-llm.xcarchive" \
            -exportPath "$MAC_RELEASE_DIR/export" \
            -exportOptionsPlist "$MAC_RELEASE_DIR/ExportOptions.plist"
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            verify --app "$MAC_RELEASE_DIR/export/term-llm.app"
      - name: Stage the notary key on the RAM disk
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" stage-notary-key
      # Waiting on the notary service takes minutes; no secret is in this step's environment.
      - name: Notarize and staple
        run: |
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            notarize --app "$MAC_RELEASE_DIR/export/term-llm.app"
      - name: Sign and publish Sparkle archive and appcast
        run: |
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            publish-sparkle --app "$MAC_RELEASE_DIR/export/term-llm.app"
      # The feed is the production release boundary. GitHub mirrors the exact zip
      # only after successful feed upload (see docs/SELF-HOSTED-CI.md#sparkle-updates).
      - name: Publish the notarized app as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" \
            publish --app "$MAC_RELEASE_DIR/export/term-llm.app" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Remove the job keychain, RAM disk, profiles and build files
        if: always()
        shell: bash
        run: |
          if [[ -n "${MAC_RELEASE_DIR:-}" ]]; then
            python3 scripts/ci/notarized-mac-build.py --work-dir "$MAC_RELEASE_DIR" cleanup
          fi
