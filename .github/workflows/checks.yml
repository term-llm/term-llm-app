name: Lightweight checks

on:
  push:
    branches: [main]
    paths:
      - '.gitleaksignore'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'Licenses/**'
      - 'Shared/**'
      - 'TermLLM/**'
      - 'TermLLMNotificationService/**'
      - 'TermLLMTests/**'
      - 'TermLLMUITests/**'
      - 'TermLLMMac/**'
      - 'TermLLMMacKit/**'
      - 'TermLLMMacTests/**'
      - 'ComputerUseKit/**'
      - 'TermLLMComputerUse/**'
      - 'TermLLMComputerCLI/**'
      - 'TermLLM.xcodeproj/**'
      - 'TestPlans/**'
      - 'push-relay/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # No hosted fallback: offline MacBook means queued checks, not paid minutes.
    runs-on: [self-hosted, macOS, ARM64, term-llm-local]
    # Never execute PR code on the persistent signing Mac, even after approval.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan full history for secrets with a checksum-pinned scanner
        run: bash scripts/ci/check-secrets.sh
      - name: Use installed MacBook tools
        run: |
          source scripts/ci/bootstrap-macos.sh
          node --version
          go version
      - name: Verify shipped license notices
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_license_notices.py' -v
          python3 scripts/check-license-notices.py
      - name: Test portable fixtures and validation helpers (no simulator journeys)
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/native-hub -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/phone-hub -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/linked-devices -p 'test_*.py' -v
          python3 scripts/test_select_ios_simulator.py
          bash -n scripts/native-hub/capture.sh
          bash -n scripts/phone-hub/capture.sh
      - name: Check notification contract and JavaScript bridge offline
        run: python3 scripts/check-notification-contract.py
      - name: Build and test push relay
        working-directory: push-relay
        run: |
          go build ./...
          go test ./...
      # Temporary homes, fake runners and stubbed HTTP only; no GUI, login item,
      # keychain or simulator. ComputerUseKit is manual: computer-use-kit-tests.yml.
      - name: Test TermLLMMacKit Swift package
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/term-llm-swiftpm.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          swift test --package-path TermLLMMacKit --scratch-path "$scratch"
