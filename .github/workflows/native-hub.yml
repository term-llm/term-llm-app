name: Native Hub simulator journey

on:
  pull_request:
    paths:
      - 'Shared/**'
      - 'TermLLM/**'
      - 'TermLLMTests/**'
      - 'TermLLMUITests/**'
      - 'TermLLM.xcodeproj/**'
      - 'scripts/native-hub/**'
      - 'scripts/select-ios-simulator.py'
      - 'docs/NATIVE-HUB-CAPTURE.md'
      - '.github/workflows/native-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify loopback protocol fixture
        run: python3 -m unittest discover -s scripts/native-hub -p 'test_*.py' -v
      - name: Select an existing iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_select_ios_simulator.py
          printf 'SIMULATOR_UDID=%s\n' "$(python3 scripts/select-ios-simulator.py)" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Build, test actual native app, and record simulator
        shell: bash
        run: bash scripts/native-hub/capture.sh
      - name: Preserve private capture and diagnostics (also on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-hub-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-hub-artifacts/
          if-no-files-found: error
          retention-days: 7
