name: Native notification checks (manual local Mac)

# Opt-in only and self-hosted: never consume GitHub-hosted runner minutes.
# The job is native-simulator-tests.yml; the suites are listed in
# TestPlans/TermLLM-Notifications.xctestplan.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/native-simulator-tests.yml
    with:
      test-plan: TermLLM-Notifications
