name: Native notification simulator checks

on:
  pull_request:
    paths:
      - 'Shared/**'
      - 'TermLLM/**'
      - 'TermLLMNotificationService/**'
      - 'TermLLMTests/**'
      - 'TermLLM.xcodeproj/**'
      - 'scripts/select-ios-simulator.py'
      - 'scripts/test_select_ios_simulator.py'
      - '.github/workflows/native-notification-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select an existing available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_select_ios_simulator.py
          udid="$(python3 scripts/select-ios-simulator.py)"
          printf 'SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Build and run isolated notification regressions without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TermLLM.xcodeproj \
            -scheme TermLLM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/NotificationDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NotificationTests.xcresult" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:TermLLMTests/WebPushCryptoTests \
            -only-testing:TermLLMTests/PushMessageTests \
            -only-testing:TermLLMTests/PushCenterTests \
            -only-testing:TermLLMTests/PushDeliveryStoreTests \
            -only-testing:TermLLMTests/NotificationMetadataTests \
            -only-testing:TermLLMTests/NativeNotificationLifecycleTests \
            -only-testing:TermLLMTests/ActualProducerFixtureTests \
            -only-testing:TermLLMTests/NotificationReviewRegressionTests \
            -only-testing:TermLLMTests/BrowserLifecycleTests \
            -only-testing:TermLLMTests/VoiceShortcutTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            2>&1 | tee "$RUNNER_TEMP/notification-xcodebuild.log"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-simulator-failure
          path: |
            ${{ runner.temp }}/NotificationTests.xcresult
            ${{ runner.temp }}/notification-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
