name: Native notification checks (manual local Mac)

# Opt-in only and self-hosted: never consume GitHub-hosted runner minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: [self-hosted, macOS, ARM64, term-llm-local]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use installed MacBook tools and selected Xcode
        run: |
          source scripts/ci/bootstrap-macos.sh
          printf 'DEVELOPER_DIR=%s\n' "$(xcode-select -p)" >> "$GITHUB_ENV"
          printf 'NATIVE_TEST_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/term-llm-native.XXXXXX")" >> "$GITHUB_ENV"
      - name: Create and boot a job-owned disposable iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_owned_ios_simulator.py
          simulator_name="term-llm-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          udid="$(python3 scripts/ci/owned-ios-simulator.py create \
            --name "$simulator_name" \
            --state-file "$NATIVE_TEST_DIR/owned-simulator.json")"
          printf 'SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Build and run isolated notification regressions without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TermLLM.xcodeproj \
            -scheme TermLLM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$NATIVE_TEST_DIR/DerivedData" \
            -resultBundlePath "$NATIVE_TEST_DIR/Tests.xcresult" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:TermLLMTests/WebPushCryptoTests \
            -only-testing:TermLLMTests/PushMessageTests \
            -only-testing:TermLLMTests/PushCenterTests \
            -only-testing:TermLLMTests/PushDeliveryStoreTests \
            -only-testing:TermLLMTests/NotificationMetadataTests \
            -only-testing:TermLLMTests/NativeNotificationLifecycleTests \
            -only-testing:TermLLMTests/ActualProducerFixtureTests \
            -only-testing:TermLLMTests/NotificationReviewRegressionTests \
            -only-testing:TermLLMTests/BrowserLifecycleTests \
            -only-testing:TermLLMTests/VoiceShortcutTests \
            -only-testing:TermLLMTests/LinkedDevicesProtocolTests \
            -only-testing:TermLLMTests/LinkedDevicesIdentityTests \
            -only-testing:TermLLMTests/LinkedDevicesRuntimeTests \
            -only-testing:TermLLMTests/PeerTransportTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            2>&1 | tee "$NATIVE_TEST_DIR/xcodebuild.log"
      - name: Delete only the job-owned simulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NATIVE_TEST_DIR:-}" && "$NATIVE_TEST_DIR" == "$RUNNER_TEMP"/term-llm-native.* ]]; then
            python3 scripts/ci/owned-ios-simulator.py cleanup \
              --state-file "$NATIVE_TEST_DIR/owned-simulator.json"
          fi
      # Keep logs in the job output; do not incur GitHub artifact storage charges.
      - name: Clean temporary native build results
        if: always()
        shell: bash
        run: |
          if [[ -n "${NATIVE_TEST_DIR:-}" && "$NATIVE_TEST_DIR" == "$RUNNER_TEMP"/term-llm-native.* ]]; then
            rm -rf -- "$NATIVE_TEST_DIR"
          fi
