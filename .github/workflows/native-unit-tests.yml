name: Native unit tests (manual local Mac)

# Opt-in only and self-hosted: never consume GitHub-hosted runner minutes.
# Runs every TermLLMTests suite and no UI tests
# (TestPlans/TermLLM-UnitTests.xctestplan) through native-simulator-tests.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    uses: ./.github/workflows/native-simulator-tests.yml
    with:
      test-plan: TermLLM-UnitTests
