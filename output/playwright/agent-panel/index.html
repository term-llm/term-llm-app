<!doctype html>
<html><head><meta charset="utf-8"><title>Agent panel concepts</title>
<style>
:root{
 --blue:#007aff;--green:#34c759;--orange:#ff9500;--yellow:#ffb700;--red:#ff3b30;--indigo:#5856d6;
 --bg:#f2f2f7;--label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
 --sep:rgba(60,60,67,.17);--fill:rgba(118,118,128,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{padding:36px;background:#d8dbe1;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
.concept{width:max-content;padding:30px 40px 34px;margin:0 0 36px;background:#e9ebef;border-radius:32px}
.concept h2{margin:0 0 10px;font-size:25px;letter-spacing:-.2px}
.concept h2 span{color:#6b6f78;font-weight:500}
.concept p.desc{margin:0 0 30px;width:1290px;font-size:15.5px;line-height:1.5;color:#2c2e33}
.phones{display:flex;gap:56px;align-items:flex-start;padding:0 12px}
.cap{margin-top:26px;text-align:center;font-size:15px;font-weight:600;color:#33363d;width:393px}
.cap small{display:block;font-weight:400;color:#666a73;margin-top:4px;font-size:13.5px;line-height:1.4}

/* ---------- device ---------- */
.phone{width:393px;height:852px;border-radius:56px;overflow:hidden;position:relative;background:var(--bg);
 box-shadow:0 0 0 11px #141414,0 0 0 12.5px #3a3a3c,0 28px 60px rgba(0,0,0,.28)}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font-weight:600;font-size:17px;z-index:80}
.sicons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:90}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000;z-index:95}
.content{position:absolute;inset:0;overflow:hidden}
.topfade{position:absolute;top:0;left:0;right:0;height:118px;background:linear-gradient(var(--bg) 62%,rgba(242,242,247,0));z-index:30}
.botfade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(rgba(242,242,247,0),rgba(242,242,247,.94) 64%);z-index:44}

.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);
 box-shadow:0 3px 14px rgba(0,0,0,.09),inset 0 0 0 .5px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.9)}
.nav{position:absolute;top:54px;left:0;right:0;height:54px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.gb{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#1c1c1e;flex:none}
.gcap{height:44px;border-radius:22px;display:flex;align-items:center;gap:2px;padding:0 4px;color:#1c1c1e}
.gcap span{width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.gcap.blue span{color:var(--blue)}
.ntitle{position:absolute;left:80px;right:80px;text-align:center;font-size:17px;font-weight:600;line-height:1.15;pointer-events:none}
.ntitle small{display:block;font-size:12px;font-weight:500;color:var(--sec)}

.tabbar{position:absolute;left:21px;right:21px;bottom:22px;height:64px;border-radius:32px;z-index:46;display:flex;padding:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:600;color:#1c1c1e;border-radius:28px}
.tab svg{height:25px}
.tab.sel{background:rgba(120,120,128,.15);color:var(--blue)}

/* ---------- lists ---------- */
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;padding:2px 20px 0;line-height:41px}
.ltsub{padding:1px 20px 0;font-size:15px;color:var(--sec);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}
.cta{height:50px;border-radius:25px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 14px rgba(0,122,255,.25)}
.search{height:40px;border-radius:20px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:7px;padding:0 13px;color:rgba(60,60,67,.6);font-size:17px}
.sh{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:700;padding:20px 20px 9px;letter-spacing:.1px}
.sh .act{margin-left:auto;font-size:17px;font-weight:400;color:var(--blue)}
.sh .pinh{color:var(--yellow);display:flex}
.sh .cd{color:var(--blue);display:flex;margin-left:2px}
.sh.sticky{position:relative;z-index:35;padding-top:12px;background:linear-gradient(var(--bg) 70%,rgba(242,242,247,.0))}
.grp{background:#fff;border-radius:26px;margin:0 16px;overflow:hidden;position:relative}
.r{display:flex;align-items:flex-start;gap:9px;padding:11px 16px 11px 11px;min-height:66px;position:relative;background:#fff}
.grp .r+.r:before,.grp .r+.swipe:before,.grp .swipe+.r:before{content:"";position:absolute;top:0;left:34px;right:0;border-top:.5px solid var(--sep);z-index:2}
.lead{width:14px;flex:none;display:flex;justify-content:center;padding-top:7px}
.udot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.udot.o{background:var(--orange)}
.pinl{color:var(--yellow);display:flex;margin-top:-2px}
.main{flex:1;min-width:0}
.l1{display:flex;align-items:baseline;gap:8px}
.t{font-size:17px;line-height:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.r.un .t{font-weight:600}
.tm{font-size:15px;color:var(--sec);flex:none;display:flex;align-items:center;gap:5px}
.l2{font-size:15px;line-height:20px;color:var(--sec);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.l2.o{color:#c96a00}.l2.b{color:var(--blue)}
.r.sk .bar{display:block;height:13px;border-radius:7px;background:linear-gradient(90deg,#ececf0 0%,#f7f7f9 45%,#ececf0 90%)}
.r.sk .l1{align-items:center;height:22px}.r.sk .l2{height:20px;display:flex;align-items:center}
.r.sk .bar.sm{height:11px}
.foot{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--sec);font-size:15px;padding:16px 0}
.note{font-size:13px;color:var(--sec);text-align:center;padding:10px 30px 0}

/* swipe */
.swipe{position:relative;overflow:hidden}
.swipe .acts{position:absolute;top:0;bottom:0;left:0;display:flex}
.swipe .acts div{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:13px;font-weight:600}
.swipe .r{transform:translateX(168px);box-shadow:-8px 0 16px rgba(0,0,0,.06)}

/* agent rows */
.ag{align-items:center;min-height:68px;padding:10px 14px}
.ag .t{font-weight:600}
.ag.sel{background:#e5e5ea}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;letter-spacing:0}
.rowbtn{width:36px;height:36px;border-radius:18px;background:rgba(0,122,255,.12);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.chev{color:rgba(60,60,67,.3);flex:none}
.seg{margin:6px 16px 0;height:36px;border-radius:18px;background:rgba(118,118,128,.12);display:flex;padding:2px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;border-radius:16px;color:#1c1c1e}
.seg div.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* sheet */
.sheet{position:absolute;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 -4px 40px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(0,0,0,.06);overflow:hidden}
.sheet.med{left:8px;right:8px;bottom:8px;top:356px;border-radius:44px}
.sheet.lg{left:0;right:0;bottom:0;top:62px;border-radius:38px 38px 0 0;background:#f7f7f9}
.grab{width:37px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:7px auto 0}
.shead{display:flex;align-items:center;gap:12px;padding:12px 16px 0 18px}
.shead .nm{flex:1;min-width:0}
.shead .nm b{display:block;font-size:22px;line-height:27px}
.shead .nm span{font-size:14px;color:var(--sec);display:flex;align-items:center;gap:6px}
.gb.sm{width:36px;height:36px;border-radius:18px;background:rgba(118,118,128,.14);box-shadow:none;color:#3c3c43}
.gb.bluefill{width:36px;height:36px;border-radius:18px;background:var(--blue);color:#fff}
.lbl{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#3c3c43;padding:18px 20px 8px}
.lbl .act{margin-left:auto;font-weight:400;color:var(--blue);font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.tile{background:#fff;border-radius:20px;padding:10px 11px;height:94px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tile .top{display:flex;justify-content:space-between;align-items:center;color:var(--yellow);font-size:12px}
.tile .top span{color:var(--sec)}
.tile .tt{font-size:14.5px;font-weight:600;line-height:18px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.2px}
.tile .tm2{margin-top:auto;font-size:12px;color:var(--sec);display:flex;align-items:center;gap:4px}
.tile .tm2.b{color:var(--blue)}.tile .tm2.o{color:#c96a00}
.sheet .grp{margin:0 12px}
.behind{position:absolute;inset:0;transform:scale(.93) translateY(-14px);border-radius:44px;overflow:hidden;background:var(--bg);filter:brightness(.82)}

/* context menu */
.blurall{position:absolute;inset:0;z-index:70;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);background:rgba(0,0,0,.18)}
.preview{position:absolute;z-index:75;left:20px;right:20px;background:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.preview .t{white-space:normal;font-weight:600}
.preview .snip{font-size:15px;line-height:21px;color:#3c3c43;margin-top:10px;padding:10px 12px;background:#f2f2f7;border-radius:14px}
.preview .snip code{font:13.5px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:5px}
.cmenu{position:absolute;z-index:75;left:20px;width:262px;border-radius:24px;background:rgba(250,250,252,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 18px 50px rgba(0,0,0,.25);padding:6px 0;overflow:hidden}
.mi{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;font-size:17px;color:#000}
.mi svg{color:#000}
.msep{height:8px;background:rgba(0,0,0,.06);margin:5px 0}

/* switcher */
.strip{display:flex;gap:16px;padding:6px 18px 0;overflow:hidden}
.sa{display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;flex:none;font-size:12px;color:#3c3c43;position:relative}
.sa .ring{padding:2.5px;border-radius:50%;border:2.5px solid transparent}
.sa.on .ring{border-color:var(--blue)}
.sa.on{color:var(--blue);font-weight:600}
.sa .badge{position:absolute;top:0;right:2px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.sa .on-dot{position:absolute;top:43px;right:7px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--bg)}
.chips{display:flex;gap:8px;padding:14px 16px 2px;overflow:hidden}
.chip{height:34px;border-radius:17px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;background:rgba(118,118,128,.12);color:#1c1c1e;white-space:nowrap;flex:none}
.chip.on{background:#1c1c1e;color:#fff}
.chip .n{color:var(--sec);font-weight:500}
.fab{position:absolute;z-index:47;left:50%;transform:translateX(-50%);bottom:100px;height:52px;border-radius:26px;padding:0 22px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,122,255,.38),0 2px 6px rgba(0,0,0,.12)}
.fab.round{left:auto;right:20px;transform:none;width:56px;height:56px;border-radius:28px;padding:0;justify-content:center}
.shelf{display:flex;gap:10px;padding:0 16px;overflow:hidden}
.pcard{width:158px;flex:none;height:104px;background:#fff;border-radius:22px;padding:11px 12px;display:flex;flex-direction:column}
.pcard .who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sec);font-weight:500}
.pcard .who .pn{margin-left:auto;color:var(--yellow);display:flex}
.pcard .tt{font-size:15px;font-weight:600;line-height:19px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.2px}
.pcard .m{margin-top:auto;font-size:12.5px;color:var(--sec);display:flex;align-items:center;gap:4px}
.pcard .m.b{color:var(--blue)}.pcard .m.o{color:#c96a00}
.scrub{position:absolute;right:4px;z-index:48;display:flex;align-items:center;gap:8px}
.scrub .bub{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.scrub .knob{width:34px;height:48px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3c3c43;gap:3px}
.track{position:absolute;right:20px;width:3px;border-radius:2px;background:rgba(60,60,67,.12);z-index:47}
.ticks{position:absolute;right:30px;z-index:47;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600;color:var(--sec);text-align:right}
</style></head><body>

/* ---------- components ---------- */
const av=(a,s)=>`<div class="av" style="width:${s}px;height:${s}px;background:${a.g};font-size:${Math.round(s*.44)}px">${a.name[0].toUpperCase()}</div>`;

 const lead=s.st==='unseen'?'<span class="udot"></span>':s.st==='input'?'<span class="udot o"></span>':(o.pinGlyph&&s.pin?`<span class="pinl">${I.pin(15)}</span>`:'');
 const cls=s.st==='input'?'o':s.st==='run'?'b':'';

/* ---------- concept 1: pushed agent page ---------- */
