# Encrypted relay vhost. Replaces nginx-bootstrap.conf or any earlier vhost at
# the same destination; never enable two vhosts for this server name at once.
# $remote_addr is restored only from trusted Cloudflare CIDRs by the host's
# /etc/nginx/conf.d/cloudflare-realip.conf. Without that trusted configuration,
# the socket peer is used; do not trust arbitrary forwarding headers.
limit_req_zone $binary_remote_addr zone=term_llm_push_rate:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=term_llm_push_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name push.term-llm.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/term-llm-push/acme;
        try_files $uri =404;
    }
    location / { return 308 https://push.term-llm.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name push.term-llm.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/push.term-llm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.term-llm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sealed subscription capabilities occur in request paths. Never log them.
    access_log off;
    error_log /var/log/nginx/term-llm-push.error.log crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 8k;
    client_body_timeout 10s;
    limit_req zone=term_llm_push_rate burst=10 nodelay;
    limit_req_status 429;
    limit_conn term_llm_push_connections 20;
    limit_conn_status 429;

    # Set all headers in this scope; location-level proxy_set_header overrides
    # nginx's inheritance, so keep the forwarding configuration together.
    proxy_http_version 1.1;
    proxy_set_header Host push.term-llm.com;
    proxy_set_header Connection "";
    proxy_set_header X-Relay-Client-IP $remote_addr;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 80s;
    proxy_next_upstream off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8768;
    }
    location = /v1/register {
        proxy_pass http://127.0.0.1:8768;
    }
    location ^~ /v1/push/ {
        proxy_pass http://127.0.0.1:8768;
    }
    # In particular, close the old operator-only POST /v1/push route.
    location / { return 404; }
}
