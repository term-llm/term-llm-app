# Included inside nginx's http context by sites-enabled/.
# Deliberately keyed to the socket peer, not an untrusted forwarding header.
limit_req_zone $binary_remote_addr zone=term_llm_push_rate:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=term_llm_push_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name push.term-llm.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/term-llm-push/acme;
        try_files $uri =404;
    }
    location / { return 308 https://push.term-llm.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name push.term-llm.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/push.term-llm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.term-llm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No request paths, payloads, tokens, or Authorization headers in access logs.
    access_log off;
    error_log /var/log/nginx/term-llm-push.error.log crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req zone=term_llm_push_rate burst=10 nodelay;
    limit_req_status 429;
    limit_conn term_llm_push_connections 20;
    limit_conn_status 429;

    location = /healthz {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host push.term-llm.com;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 80s;
        proxy_next_upstream off;
    }
    location = /v1/push {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host push.term-llm.com;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 80s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
