# Install temporarily for ACME HTTP-01 before the full TLS vhost.
server {
    listen 80;
    listen [::]:80;
    server_name push.term-llm.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/term-llm-push/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
